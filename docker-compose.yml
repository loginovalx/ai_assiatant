# Весь проект одной командой: docker compose up --build
# Схема БД применяется при первом старте на пустом volume (db/migrations).

x-python-service: &python-service
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine  # форк Redis, совместим по протоколу
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    build:
      context: .
      dockerfile: infra/Dockerfile
      args: { GROUP: mcp }
    command: ["python", "-m", "scripts.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    <<: *python-service
    build:
      context: .
      dockerfile: infra/Dockerfile
      args: { GROUP: mcp }
    command: ["python", "-m", "mcp_server.server"]
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *python-service
    build:
      context: .
      dockerfile: infra/Dockerfile
      args: { GROUP: api }
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenAI-совместимый прокси к GigaChat: агент говорит с ним через библиотеку openai.
  gpt2giga:
    image: ghcr.io/ai-forever/gpt2giga:0.3.1a1
    environment:
      GPT2GIGA_MODE: DEV
      GPT2GIGA_HOST: 0.0.0.0
      GPT2GIGA_PORT: 8090
      GPT2GIGA_ENABLE_API_KEY_AUTH: "True"
      GPT2GIGA_API_KEY: ${LLM_API_KEY}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${LLM_MODEL:-GigaChat-2-Max}
      GIGACHAT_VERIFY_SSL_CERTS: "False"
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped

  agent:
    <<: *python-service
    build:
      context: .
      dockerfile: infra/Dockerfile
      args: { GROUP: agent }
    command: ["uvicorn", "agent.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      # environment не сливается с якорем, поэтому перечисляем всё заново
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MCP_URL: http://mcp:8001/mcp
      LLM_BASE_URL: http://gpt2giga:8090/v1
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    depends_on:
      redis:
        condition: service_healthy
      mcp:
        condition: service_healthy
      gpt2giga:
        condition: service_started
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Бот (B): принимает вебхук от MAX, сам ходит только в Redis (дедупликация/FSM) и в agent —
  # с базой напрямую не работает, поэтому зависимости от postgres здесь нет.
  # MAX требует HTTPS на 443 с доверенным сертификатом — в проде перед bot должен стоять
  # реверс-прокси (или туннель на время теста); порт 8080 наружу — только для него.
  bot:
    <<: *python-service
    build:
      context: .
      dockerfile: infra/Dockerfile
      args: { GROUP: bot }
    command: ["uvicorn", "bot.webhook:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers"]
    environment:
      # Боту нужна база: планировщик сам достаёт из неё наступившие напоминания,
      # а присланный в чат CSV-календарь сохраняется туда же, к голосовым записям.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      AGENT_URL: http://agent:8002
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
