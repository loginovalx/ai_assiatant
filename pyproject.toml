[project]
name = "voice-assistant"
version = "0.1.0"
description = "Голосовой ассистент для задач и встреч в MAX"
requires-python = ">=3.12"
# Общие зависимости, которые нужны пакету common (его используют все сервисы).
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "gigachat>=0.1.40",
]

# Каждый сервис ставит только свою группу: `uv sync --group mcp`.
# Владельцы bot / agent дописывают сюда свои зависимости.
[dependency-groups]
mcp = ["fastmcp>=4.1"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

bot = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "faster-whisper>=1.0",
    "av<19",
]
agent = ["fastmcp>=4.1", "fastapi>=0.115", "uvicorn[standard]>=0.30", "openai>=1.50", "redis>=5.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
    { include-group = "mcp" },
    { include-group = "api" },
    { include-group = "agent" },
    { include-group = "bot" },
]

[tool.uv]
# Монорепа из сервисов, а не устанавливаемая библиотека: код запускается из корня репо.
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
